<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
    a { color: #3A5BC7; } a:hover { color: #2C48A8; }
    .mono { font-family: "IBM Plex Mono", Consolas, monospace; }
  </style>
</helmet>

<div style="width: 520px; height: 400px; background: #EFF0F3; color: #1B1E23; padding: 26px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; font-size: 13px;">

  <!-- 실행 중 -->
  <div style="display: flex; flex-direction: column; gap: 7px;">
    <span style="font-size: 10.5px; font-weight: 600; color: #8C939F; letter-spacing: 0.4px;">실행 중</span>

    <div style="width: 468px; border-radius: 10px; background: #FFFFFF; border: 1px solid #D3D6DD; box-shadow: 0 2px 10px rgba(27,30,35,0.12); overflow: hidden;">

      <div style="display: flex; align-items: center; gap: 10px; padding: 11px 12px 0;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #1F8A70; flex-shrink: 0;"></span>
        <span style="font-size: 12.5px; font-weight: 500;">실행 중</span>
        <span class="mono" style="font-size: 11.5px; color: #5A616D; font-variant-numeric: tabular-nums;">00:12</span>
        <span style="flex-grow: 1;"></span>
        <span style="font-size: 11.5px; color: #8C939F;">3회차</span>
        <span style="width: 22px; height: 22px; border-radius: 5px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#A9AEB9" stroke-width="1.5" stroke-linecap="round"><circle cx="4.4" cy="4" r=".9"></circle><circle cx="11.6" cy="4" r=".9"></circle><circle cx="4.4" cy="8" r=".9"></circle><circle cx="11.6" cy="8" r=".9"></circle><circle cx="4.4" cy="12" r=".9"></circle><circle cx="11.6" cy="12" r=".9"></circle></svg>
        </span>
      </div>

      <div style="display: flex; align-items: center; gap: 9px; padding: 9px 12px 0;">
        <span style="width: 24px; height: 24px; border-radius: 6px; background: #FBF3E3; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#C07818" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="1.6"></rect><circle cx="5.8" cy="6.4" r="1.1"></circle><path d="M2.4 11l3.3-3 2.4 2.2 2.2-2 3.3 3"></path></svg>
        </span>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
          <span style="font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">이미지 있음</span>
          <span class="mono" style="font-size: 10.5px; color: #8C939F; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">로그인_버튼.png</span>
        </div>
        <span class="mono" style="font-size: 10.5px; color: #A9AEB9; flex-shrink: 0;">n2</span>
      </div>

      <div style="padding: 11px 12px 0;">
        <div style="height: 3px; border-radius: 2px; background: #EDEFF3; overflow: hidden;">
          <div style="width: 25%; height: 3px; border-radius: 2px; background: #1F8A70;"></div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 5px;">
          <span style="font-size: 10.5px; color: #A9AEB9;">노드 <span class="mono" style="color: #5A616D;">2</span> / <span class="mono">8</span></span>
          <span style="font-size: 10.5px; color: #A9AEB9;">로그인_자동화</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; padding: 11px 12px 12px;">
        <button style="height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid #C4453D; background: #C4453D; color: #FFFFFF; font-family: inherit; font-size: 12.5px; font-weight: 500; display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><rect x="3.2" y="3.2" width="9.6" height="9.6" rx="1.4"></rect></svg>
          중지
          <span class="mono" style="font-size: 10.5px; opacity: 0.75;">F9</span>
        </button>
        <button style="height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid #E3E5EA; background: #FFFFFF; color: #1B1E23; font-family: inherit; font-size: 12.5px; display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><rect x="3.6" y="2.8" width="3" height="10.4" rx="1"></rect><rect x="9.4" y="2.8" width="3" height="10.4" rx="1"></rect></svg>
          일시정지
        </button>
        <span style="flex-grow: 1;"></span>
        <span style="font-size: 10.5px; color: #A9AEB9;">항상 위에 표시</span>
      </div>

    </div>
  </div>

  <!-- 완료 -->
  <div style="display: flex; flex-direction: column; gap: 7px;">
    <span style="font-size: 10.5px; font-weight: 600; color: #8C939F; letter-spacing: 0.4px;">완료</span>

    <div style="width: 468px; border-radius: 10px; background: #FFFFFF; border: 1px solid #D3D6DD; box-shadow: 0 2px 10px rgba(27,30,35,0.12); overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px;">
        <span style="width: 26px; height: 26px; border-radius: 7px; background: #E4F1EC; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#1F8A70" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 8.4l3 3 6.2-6.8"></path></svg>
        </span>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
          <span style="font-size: 12.5px; font-weight: 500;">완료</span>
          <span style="font-size: 10.5px; color: #8C939F;">
            <span class="mono">5</span>회 반복 · 노드 <span class="mono">40</span>개 실행 · <span class="mono">00:47</span>
          </span>
        </div>
        <button style="height: 30px; padding: 0 12px; flex-shrink: 0; border-radius: 6px; border: 1px solid #E3E5EA; background: #FFFFFF; color: #1B1E23; font-family: inherit; font-size: 12.5px; cursor: pointer;">닫기</button>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
